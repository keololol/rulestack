<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f7f7f7;
      color: #222;
    }
    h1 { color: #d9480f; }
    button {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Hello, world!</h1>
  <p>This is my first HTML page. Edit this file, save it, and refresh the browser to see changes.</p>

  <h2>A list</h2>
  <ul>
    <li>HTML = structure (what's on the page)</li>
    <li>CSS = style (how it looks)</li>
    <li>JavaScript = behaviour (what it does)</li>
  </ul>

  <button onclick="document.getElementById('msg').textContent = 'You clicked the button!'">
    Click me
  </button>
  <p id="msg"></p>
</body>
</html>
